version: "2"
run:
  timeout: 5m
  go: "1.26"
linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
  settings:
    staticcheck:
      # Disable QF* quick-fix/style refactors; keep SA* bug checks and ST* style-error checks.
      checks: ["all", "-QF1003", "-QF1008"]
  exclusions:
    paths:
      - bindings
      - frontend
      - dist
      - bin
      - node_modules
      - build
