name: ci

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify open-source docs
        shell: bash
        run: ./scripts/verify-license.sh

      - name: Verify Homebrew formula template
        # Ruby ships preinstalled on ubuntu-latest and macos-latest runners
        # but may not on windows-latest; Homebrew users never install from
        # Windows, so Linux + macOS coverage is sufficient (story 7-4 Task 5.2).
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          # Stub out @@...@@ tokens so `ruby -c` sees syntactically valid Ruby.
          # Real CI render + push happens in release.yml on version tags.
          tmpl=scripts/homebrew/unipdf-debugger.rb.tmpl
          [ -f "$tmpl" ] || { echo "formula template missing"; exit 1; }
          stubbed="$(mktemp -t formula.rb.XXXXXX)"
          sed -e 's|@@VERSION@@|0.0.0|g' \
              -e 's|@@DARWIN_ARM64_URL@@|https://example.com/arm64|g' \
              -e 's|@@DARWIN_AMD64_URL@@|https://example.com/amd64|g' \
              -e 's|@@LINUX_AMD64_URL@@|https://example.com/linux|g' \
              -e "s|@@DARWIN_ARM64_SHA256@@|$(printf '0%.0s' {1..64})|g" \
              -e "s|@@DARWIN_AMD64_SHA256@@|$(printf '1%.0s' {1..64})|g" \
              -e "s|@@LINUX_AMD64_SHA256@@|$(printf '2%.0s' {1..64})|g" \
              "$tmpl" > "$stubbed"
          ruby -c "$stubbed"
          rm -f "$stubbed"

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: |
            go.sum
            tests/**/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux native deps
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev build-essential

      - name: Install Wails v3 CLI
        shell: bash
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-alpha.74

      - name: Install golangci-lint v2
        shell: bash
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.1.6

      - name: Install frontend deps
        shell: bash
        run: npm ci --prefix frontend

      - name: Generate Wails bindings
        shell: bash
        run: wails3 generate bindings -clean=true

      - name: Go vet
        shell: bash
        run: go vet ./...

      - name: Go lint (golangci-lint)
        shell: bash
        run: golangci-lint run --timeout 5m ./...

      - name: Go test (root module)
        shell: bash
        run: go test ./... -timeout 10m

      - name: Test acceptance suites (per-module)
        shell: bash
        timeout-minutes: 20
        run: |
          set -euo pipefail
          shopt -s nullglob
          mods=(tests/*/go.mod)
          if [[ ${#mods[@]} -eq 0 ]]; then
            echo "No per-suite go.mod files found under tests/*/ -- expected 20"
            exit 1
          fi
          for mod in "${mods[@]}"; do
            dir="$(dirname "$mod")"
            case "$(basename "$dir")" in
              e2e|support) continue ;;
            esac
            echo "::group::go test $dir"
            (cd "$dir" && go test ./... -timeout 5m)
            echo "::endgroup::"
          done

      - name: Frontend typecheck
        shell: bash
        run: npm run typecheck --prefix frontend

      - name: Frontend lint
        shell: bash
        run: npm run lint --prefix frontend

      - name: Frontend test (Vitest)
        shell: bash
        run: npm run test --prefix frontend

      - name: Wails build (GUI)
        shell: bash
        run: wails3 build

      - name: CLI build sanity check
        shell: bash
        run: go build -o bin/pdfdebug ./cmd/cli/
