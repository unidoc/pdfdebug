name: ci

on:
  pull_request:
    branches: [master, dev]
  push:
    branches: [master, dev]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Verify open-source docs
        shell: bash
        run: ./scripts/verify-license.sh

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache-dependency-path: |
            go.sum
            tests/**/go.sum

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux native deps
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev build-essential xvfb

      - name: Configure Linux GTK3 build tag
        # Wails alpha.93 promoted GTK4 + WebKitGTK 6.0 to the Linux default;
        # the only GTK headers installed on the runner are GTK3 + WebKit2GTK 4.1
        # (the "Install Linux native deps" step above). Without the `gtk3` build
        # tag, `go vet`, `go test`, `golangci-lint`, and `wails3 generate bindings`
        # all type-check `pkg/application/application_linux.go` which `#cgo`s
        # `pkg-config gtk4 webkitgtk-6.0` and fails. GOFLAGS propagates the tag
        # to every subsequent `go`/`go list`/go-packages-based invocation in
        # this job. The Wails build step below still needs `EXTRA_TAGS=gtk3`
        # explicitly because the Taskfile combines it with `-tags production`
        # to form BUILD_FLAGS (`build/linux/Taskfile.yml:57`); a CLI
        # `-tags gtk3` arg on `wails3 build` does NOT reach the Taskfile's
        # BUILD_FLAGS construction.
        if: runner.os == 'Linux'
        shell: bash
        run: echo "GOFLAGS=-tags=gtk3" >> "$GITHUB_ENV"

      - name: Install Wails v3 CLI
        shell: bash
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-alpha2.103

      - name: Install golangci-lint v2
        shell: bash
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.1.6

      - name: Install frontend deps
        shell: bash
        run: npm ci --prefix frontend

      - name: Generate Wails bindings
        shell: bash
        run: wails3 generate bindings -clean=true

      - name: Build frontend
        # Required before any Go build/vet/test: main.go has `//go:embed
        # all:frontend/dist`, which fails to resolve on a clean checkout where
        # frontend/dist does not yet exist. The smoke `wails3 build` step later
        # rebuilds, but vet/lint/test all need the embed satisfied first.
        shell: bash
        run: npm run build --prefix frontend

      - name: Go vet
        shell: bash
        run: go vet ./...

      - name: Go lint (golangci-lint)
        shell: bash
        run: golangci-lint run --timeout 5m ./...

      - name: Go test (root module)
        shell: bash
        run: go test ./... -timeout 10m

      - name: Test acceptance suites (per-module)
        shell: bash
        timeout-minutes: 20
        # Coverage policy (asymmetric by OS/arch):
        #   ubuntu (amd64) -> every module: the comprehensive correctness gate.
        #   macos  (arm64) -> every module: the ONLY arm64 runner, so it is the
        #                     sole cross-arch check of the logic suites.
        #   windows (amd64)-> ONLY the CLI / OS-boundary suites (win_subset).
        # The pure-logic suites (internal/pdfcore + frontend logic) are
        # deterministic Go and produce identical results on every OS/arch
        # (Go language guarantees; fixtures are byte-identical via .gitattributes
        # `*.pdf binary` + `eol=lf`). Running all of them on Windows (amd64) adds
        # no signal over Linux and was ~16m of the Windows job. win_subset is the
        # modules that build and run the pdfdebug binary as a subprocess -- the
        # ones that actually touch process spawning, file paths, and stdout on
        # Windows. A new module defaults to Linux/macOS only; add it to
        # win_subset ONLY if it exercises a Windows-specific boundary.
        run: |
          set -euo pipefail
          shopt -s nullglob
          win_subset=(
            11-6-page-render-info
            13-1-cli-output-format-normalization
            13-2-embedded-data-inspector
            13-3-font-cmap-glyph
            13-4-signature-decomposition
            13-5-compliance-validation
            13-6-structural-diff
            cli-object-query
            cli-page-render
            cli-stream-retrieval
            cli-tree-dump
            cli-views
          )
          in_subset() {
            local n="$1"
            for s in "${win_subset[@]}"; do [[ "$s" == "$n" ]] && return 0; done
            return 1
          }
          mods=(tests/*/go.mod)
          if [[ ${#mods[@]} -eq 0 ]]; then
            echo "No per-suite go.mod files found under tests/*/"
            exit 1
          fi
          ran=0
          for mod in "${mods[@]}"; do
            dir="$(dirname "$mod")"
            name="$(basename "$dir")"
            case "$name" in
              e2e|support|boot-smoke) continue ;;
            esac
            if [[ "$RUNNER_OS" == "Windows" ]] && ! in_subset "$name"; then
              echo "skip (non-boundary logic suite, covered on Linux/macOS): $name"
              continue
            fi
            echo "::group::go test $dir"
            (cd "$dir" && go test ./... -timeout 5m)
            echo "::endgroup::"
            ran=$((ran + 1))
          done
          echo "ran $ran acceptance module(s) on $RUNNER_OS"

      - name: Frontend typecheck
        shell: bash
        run: npm run typecheck --prefix frontend

      - name: Frontend lint
        shell: bash
        run: npm run lint --prefix frontend

      - name: Frontend test (Vitest)
        shell: bash
        run: npm run test --prefix frontend

      - name: Wails build (GUI)
        shell: bash
        # Wails alpha.93 promoted GTK4 + WebKitGTK 6.0 to the Linux default.
        # CI installs the libgtk-3-dev + libwebkit2gtk-4.1-dev stack, so on
        # Linux we drive the linux:build task with `EXTRA_TAGS=gtk3` (the
        # Taskfile combines it into `-tags production,gtk3`, which propagates
        # to `wails3 generate bindings -f` -- matches release.yml). macOS and
        # Windows use the default `wails3 build` path.
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            wails3 task linux:build EXTRA_TAGS=gtk3
          else
            wails3 build
          fi

      - name: Boot-smoke
        shell: bash
        timeout-minutes: 5
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            cd tests/boot-smoke && xvfb-run -a go test -count=1 -timeout 3m ./...
          else
            cd tests/boot-smoke && go test -count=1 -timeout 3m ./...
          fi

      - name: CLI build sanity check
        shell: bash
        run: go build -o bin/pdfdebug ./cmd/cli/
