name: ci

on:
  pull_request:
    branches: [master, dev]
  push:
    branches: [master, dev]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Verify open-source docs
        shell: bash
        run: ./scripts/verify-license.sh

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache-dependency-path: |
            go.sum
            tests/**/go.sum

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux native deps
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev build-essential xvfb

      - name: Install Wails v3 CLI
        shell: bash
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-alpha.86

      - name: Install golangci-lint v2
        shell: bash
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.1.6

      - name: Install frontend deps
        shell: bash
        run: npm ci --prefix frontend

      - name: Generate Wails bindings
        shell: bash
        run: wails3 generate bindings -clean=true

      - name: Build frontend
        # Required before any Go build/vet/test: main.go has `//go:embed
        # all:frontend/dist`, which fails to resolve on a clean checkout where
        # frontend/dist does not yet exist. The smoke `wails3 build` step later
        # rebuilds, but vet/lint/test all need the embed satisfied first.
        shell: bash
        run: npm run build --prefix frontend

      - name: Go vet
        shell: bash
        run: go vet ./...

      - name: Go lint (golangci-lint)
        shell: bash
        run: golangci-lint run --timeout 5m ./...

      - name: Go test (root module)
        shell: bash
        run: go test ./... -timeout 10m

      - name: Test acceptance suites (per-module)
        shell: bash
        timeout-minutes: 20
        run: |
          set -euo pipefail
          shopt -s nullglob
          mods=(tests/*/go.mod)
          if [[ ${#mods[@]} -eq 0 ]]; then
            echo "No per-suite go.mod files found under tests/*/ -- expected 20"
            exit 1
          fi
          for mod in "${mods[@]}"; do
            dir="$(dirname "$mod")"
            case "$(basename "$dir")" in
              e2e|support|boot-smoke) continue ;;
            esac
            echo "::group::go test $dir"
            (cd "$dir" && go test ./... -timeout 5m)
            echo "::endgroup::"
          done

      - name: Frontend typecheck
        shell: bash
        run: npm run typecheck --prefix frontend

      - name: Frontend lint
        shell: bash
        run: npm run lint --prefix frontend

      - name: Frontend test (Vitest)
        shell: bash
        run: npm run test --prefix frontend

      - name: Wails build (GUI)
        shell: bash
        run: wails3 build

      - name: Boot-smoke
        shell: bash
        timeout-minutes: 5
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            cd tests/boot-smoke && xvfb-run -a go test -count=1 -timeout 3m ./...
          else
            cd tests/boot-smoke && go test -count=1 -timeout 3m ./...
          fi

      - name: CLI build sanity check
        shell: bash
        run: go build -o bin/pdfdebug ./cmd/cli/
