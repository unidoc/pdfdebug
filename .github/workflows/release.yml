name: release

on:
  push:
    # Per AC #1 / Task 1.1: glob-match any `v*` tag. The `Resolve version` step
    # rejects non-SemVer tags at runtime as defense-in-depth.
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (must already exist, e.g. v1.2.3 or v1.2.3-rc.1)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  # Group by resolved tag so push:tag and workflow_dispatch for the same tag serialize.
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS Intel (darwin-amd64) was dropped after the v0.1.0-rc1 dry-run
          # found macos-13 runner queue times unreliable. Re-add if user demand surfaces.
          - { os: macos-latest,   arch: arm64, goos: darwin,  platform: darwin-arm64 }
          - { os: windows-latest, arch: amd64, goos: windows, platform: windows-amd64 }
          - { os: ubuntu-latest,  arch: amd64, goos: linux,   platform: linux-amd64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          # For push:tags, `github.ref` is the tag ref (correct).
          # For workflow_dispatch, default `github.ref` is the dispatch branch,
          # so the build would use branch HEAD instead of the tag commit.
          # Explicitly check out the requested tag when dispatched.
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: |
            go.sum
            tests/**/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux native deps
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev build-essential

      - name: Install Wails v3 CLI
        shell: bash
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-alpha.74

      - name: Install frontend deps
        shell: bash
        run: npm ci --prefix frontend

      - name: Generate Wails bindings
        shell: bash
        run: wails3 generate bindings -clean=true

      - name: Resolve version
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          raw="${INPUT_TAG:-${GITHUB_REF_NAME:-}}"
          # Reject empty tag and tags that don't match SemVer-ish v<MAJOR>.<MINOR>.<PATCH>[-pre][+build].
          # Prevents shell/ldflag/PlistBuddy injection via crafted tags.
          if [ -z "$raw" ]; then
            echo "Refusing to build: no tag resolved (INPUT_TAG and GITHUB_REF_NAME both empty)" >&2
            exit 1
          fi
          if ! [[ "$raw" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Refusing to build: tag '$raw' is not a valid SemVer tag (expected vX.Y.Z[-pre][+build])" >&2
            exit 1
          fi
          echo "VERSION=${raw#v}" >> "$GITHUB_ENV"

      - name: Detect Apple signing secrets
        id: apple_secrets
        shell: bash
        env:
          APPLE_DEVELOPER_ID: ${{ secrets.APPLE_DEVELOPER_ID }}
          APPLE_CERT_P12: ${{ secrets.APPLE_DEVELOPER_ID_CERT_P12_BASE64 }}
          APPLE_CERT_PASS: ${{ secrets.APPLE_DEVELOPER_ID_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          # Notarization is disabled, so only the three codesign secrets are required.
          # A partial or empty set marks available=false so the build produces an
          # unsigned artifact instead of failing the sign step with opaque errors.
          # Filenames do not encode signing state -- see README "macOS unsigned
          # builds" for what end users should expect.
          if [ -n "${APPLE_DEVELOPER_ID:-}" ] \
             && [ -n "${APPLE_CERT_P12:-}" ] \
             && [ -n "${APPLE_CERT_PASS:-}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            if [ -n "${APPLE_DEVELOPER_ID:-}" ]; then
              echo "::warning::Apple signing partially configured; producing unsigned macOS artifacts." >&2
            fi
          fi

      - name: Import Apple Developer ID cert
        if: startsWith(matrix.os, 'macos') && steps.apple_secrets.outputs.available == 'true'
        shell: bash
        env:
          APPLE_CERT_P12: ${{ secrets.APPLE_DEVELOPER_ID_CERT_P12_BASE64 }}
          APPLE_CERT_PASS: ${{ secrets.APPLE_DEVELOPER_ID_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/build.keychain"
          KEYCHAIN_PASS="$(openssl rand -base64 32)"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          # KEYCHAIN_PASS is only needed within this step; do NOT write to $GITHUB_ENV
          # (values there are not auto-masked and would leak to every downstream step's env).
          EXISTING_KEYCHAINS="$(security list-keychains -d user | tr -d '"' | xargs)"
          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          echo "$APPLE_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$APPLE_CERT_PASS" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASS" "$KEYCHAIN"
          # shellcheck disable=SC2086
          security list-keychains -d user -s "$KEYCHAIN" $EXISTING_KEYCHAINS
          rm "$RUNNER_TEMP/cert.p12"

      - name: Set Info.plist version
        if: startsWith(matrix.os, 'macos')
        shell: bash
        run: |
          set -euo pipefail
          # CFBundle*Version must be dot-separated integers for Apple validators.
          # Strip both SemVer pre-release (`-rc1`) and build-metadata (`+build.1`)
          # suffixes; full semver stays in the artifact filename and CLI --version.
          PLIST_VERSION="${VERSION%%-*}"
          PLIST_VERSION="${PLIST_VERSION%%+*}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${PLIST_VERSION}" build/darwin/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${PLIST_VERSION}" build/darwin/Info.plist

      - name: Build macOS GUI
        if: startsWith(matrix.os, 'macos')
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          wails3 task darwin:package ARCH="$ARCH"
          test -d "bin/UniDoc PDF Debugger.app"

      - name: Sign macOS app bundle
        if: startsWith(matrix.os, 'macos') && steps.apple_secrets.outputs.available == 'true'
        timeout-minutes: 10
        shell: bash
        env:
          IDENTITY: ${{ secrets.APPLE_DEVELOPER_ID }}
        run: |
          set -euo pipefail
          APP="bin/UniDoc PDF Debugger.app"
          # Verify the imported signing identity is actually present before invoking
          # codesign; otherwise the failure reads as "no identity found" with no context.
          # `grep -F` matches literally: IDENTITY contains regex metacharacters
          # (`.` and `()`) that would otherwise be interpreted as regex syntax.
          if ! security find-identity -v -p codesigning "${KEYCHAIN:-}" | grep -qF "$IDENTITY"; then
            echo "Signing identity '$IDENTITY' not found in keychain; aborting." >&2
            exit 1
          fi
          # Retry codesign up to 3 times: transient TSA (--timestamp) failures are common.
          for attempt in 1 2 3; do
            if codesign --force --deep --options runtime \
                 --entitlements build/darwin/entitlements.plist \
                 --sign "$IDENTITY" \
                 --timestamp \
                 "$APP"; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "codesign failed after 3 attempts" >&2
              exit 1
            fi
            echo "codesign attempt $attempt failed; retrying in $((attempt * 10))s" >&2
            sleep $((attempt * 10))
          done
          codesign --verify --deep --strict --verbose=2 "$APP"

      - name: Build Windows GUI
        if: matrix.os == 'windows-latest'
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          wails3 task windows:build ARCH="$ARCH"
          test -f "bin/unidoc-pdf-debugger.exe"

      - name: Build Linux GUI
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          wails3 task linux:build ARCH="$ARCH"
          test -f "bin/unidoc-pdf-debugger"

      - name: Build CLI
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          out="pdfdebug"
          if [ "$GOOS" = "windows" ]; then out="pdfdebug.exe"; fi
          go build -trimpath -ldflags="-s -w -X main.version=${VERSION}" -o "bin/${out}" ./cmd/cli

      - name: CLI smoke test
        shell: bash
        env:
          RUNNER_OS_NAME: ${{ runner.os }}
        run: |
          set -euo pipefail
          bin="pdfdebug"
          if [ "$RUNNER_OS_NAME" = "Windows" ]; then bin="pdfdebug.exe"; fi
          "./bin/$bin" --help >/dev/null

      - name: Stage artifacts
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          mkdir -p dist
          case "$PLATFORM" in
            darwin-arm64|darwin-amd64)
              APP="bin/UniDoc PDF Debugger.app"
              # GUI: DMG with the .app, LICENSE/NOTICE, and an Applications
              # symlink so the mounted volume shows the standard drag-to-install
              # layout. LICENSE/NOTICE ship at DMG root for Apache 2.0 sec 4.
              STAGE="$RUNNER_TEMP/dmg-stage"
              rm -rf "$STAGE" && mkdir -p "$STAGE"
              cp -R "$APP" "$STAGE/"
              cp LICENSE NOTICE "$STAGE/"
              ln -s /Applications "$STAGE/Applications"
              hdiutil create \
                -volname "UniDoc PDF Debugger" \
                -srcfolder "$STAGE" \
                -ov -format UDZO \
                "dist/unidoc-pdf-debugger-${VERSION}-${PLATFORM}.dmg"
              # CLI: tar.gz with LICENSE/NOTICE bundled.
              CLI_STAGE="$RUNNER_TEMP/darwin-cli-stage"
              rm -rf "$CLI_STAGE" && mkdir -p "$CLI_STAGE"
              cp "bin/pdfdebug" "$CLI_STAGE/"
              cp LICENSE NOTICE "$CLI_STAGE/"
              tar -czf "dist/pdfdebug-cli-${VERSION}-${PLATFORM}.tar.gz" \
                  -C "$CLI_STAGE" .
              ;;
            windows-amd64)
              # GUI: ZIP with the .exe renamed to "UniDoc PDF Debugger.exe"
              # (matches the macOS .app bundle display name) + LICENSE/NOTICE.
              GUI_STAGE="$RUNNER_TEMP/win-gui-stage"
              rm -rf "$GUI_STAGE" && mkdir -p "$GUI_STAGE"
              cp "bin/unidoc-pdf-debugger.exe" "$GUI_STAGE/UniDoc PDF Debugger.exe"
              cp LICENSE NOTICE "$GUI_STAGE/"
              ( cd "$GUI_STAGE" && 7z a -tzip -bd \
                  "$GITHUB_WORKSPACE/dist/unidoc-pdf-debugger-${VERSION}-${PLATFORM}.zip" . )
              # CLI: ZIP with pdfdebug.exe (lowercase; shell-typed) + LICENSE/NOTICE.
              CLI_STAGE="$RUNNER_TEMP/win-cli-stage"
              rm -rf "$CLI_STAGE" && mkdir -p "$CLI_STAGE"
              cp "bin/pdfdebug.exe" "$CLI_STAGE/"
              cp LICENSE NOTICE "$CLI_STAGE/"
              ( cd "$CLI_STAGE" && 7z a -tzip -bd \
                  "$GITHUB_WORKSPACE/dist/pdfdebug-cli-${VERSION}-${PLATFORM}.zip" . )
              ;;
            linux-amd64)
              # GUI: tar.gz with LICENSE/NOTICE bundled.
              GUI_STAGE="$RUNNER_TEMP/linux-gui-stage"
              rm -rf "$GUI_STAGE" && mkdir -p "$GUI_STAGE"
              cp "bin/unidoc-pdf-debugger" "$GUI_STAGE/"
              cp LICENSE NOTICE "$GUI_STAGE/"
              tar -czf "dist/unidoc-pdf-debugger-${VERSION}-${PLATFORM}.tar.gz" \
                  -C "$GUI_STAGE" .
              # CLI: tar.gz with LICENSE/NOTICE bundled.
              CLI_STAGE="$RUNNER_TEMP/linux-cli-stage"
              rm -rf "$CLI_STAGE" && mkdir -p "$CLI_STAGE"
              cp "bin/pdfdebug" "$CLI_STAGE/"
              cp LICENSE NOTICE "$CLI_STAGE/"
              tar -czf "dist/pdfdebug-cli-${VERSION}-${PLATFORM}.tar.gz" \
                  -C "$CLI_STAGE" .
              ;;
          esac
          ls -la dist/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.platform }}
          path: dist/
          retention-days: 7

      - name: Cleanup keychain
        if: always() && startsWith(matrix.os, 'macos')
        shell: bash
        run: |
          if [ -n "${KEYCHAIN:-}" ] && [ -f "$KEYCHAIN" ]; then
            security delete-keychain "$KEYCHAIN" || true
          fi

  release:
    needs: build
    runs-on: ubuntu-latest
    outputs:
      # Exposed for the downstream `homebrew` job (see AC #5): the homebrew
      # job gates its execution on `needs.release.outputs.prerelease == 'false'`
      # and reuses `tag` without re-parsing $GITHUB_REF_NAME.
      prerelease: ${{ steps.prerelease.outputs.prerelease }}
      tag:        ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist/
          pattern: build-*
          merge-multiple: true

      - name: Resolve release tag
        id: tag
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-${GITHUB_REF_NAME:-}}"
          # Re-validate here so a caller can't bypass the build-job regex via inputs
          # on a workflow_dispatch re-run and publish a release with an arbitrary name.
          if [ -z "$tag" ]; then
            echo "No release tag resolved" >&2
            exit 1
          fi
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Refusing to publish: tag '$tag' is not a valid SemVer tag" >&2
            exit 1
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Compute SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 \
            | LC_ALL=C sort -z \
            | xargs -0 shasum -a 256 \
            | sed 's| \./| |' > SHA256SUMS.txt
          cat SHA256SUMS.txt
          # Manifest integrity guard: refuse to publish if the manifest is empty, the
          # line count drifts from the number of files staged for release, or the file
          # count drifts from AC #7's contractual "8 assets" invariant (4 matrix cells
          # x 2 artifacts/cell). Catches any future staging regression that drops or
          # duplicates an artifact before it reaches the Release page.
          EXPECTED_FILES=6
          FILES=$(find . -maxdepth 1 -type f ! -name SHA256SUMS.txt | wc -l | tr -d ' ')
          LINES=$(wc -l < SHA256SUMS.txt | tr -d ' ')
          if [ "$FILES" -eq 0 ]; then
            echo "No release artifacts found in dist/; refusing to publish empty release." >&2
            exit 1
          fi
          if [ "$FILES" != "$LINES" ]; then
            echo "SHA256SUMS line count ($LINES) does not match artifact count ($FILES)." >&2
            exit 1
          fi
          if [ "$FILES" != "$EXPECTED_FILES" ]; then
            echo "Expected $EXPECTED_FILES release artifacts (3 platforms x 2 artifacts), got $FILES." >&2
            find . -maxdepth 1 -type f ! -name SHA256SUMS.txt | LC_ALL=C sort >&2
            exit 1
          fi
          shasum -a 256 -c SHA256SUMS.txt

      - name: Determine pre-release flag
        id: prerelease
        shell: bash
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          # Per AC #7: mark as pre-release when the tag carries an rc/alpha/beta
          # suffix; otherwise promote to "latest".
          if [[ "$TAG" =~ -(rc|alpha|beta) ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          prerelease: ${{ steps.prerelease.outputs.prerelease }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*
